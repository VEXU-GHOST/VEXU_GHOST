ghost_serial_node:
  ros__parameters:
    port_name: "/dev/ttyACM1"
    backup_port_name: "/dev/ttyACM2"
    verbose: false

ghost_sensor_host_serial_node:
  ros__parameters:
    serial_port: "/dev/ttyACM0"   # RP2040 sensor host (separate from the V5 brain on ttyACM1/2)
    topic_namespace: "/sensors"
    # Devices are declared in alpha_sensor_host_config.yaml (device_config,
    # set by the launch file). See ghost_sensor_host/PROTOCOL.md §8.

imu_filter_node:
  ros__parameters:
    input_imu_topic: /sensors/imu
    output_imu_topic: /estimation/imu/filtered
    calculate_bias: false
    calculate_covariance: false
    calibration_time: 5.0
    sensor_frequency: 100.0
    heading_covariance: 0.001

    accel_bias_x: 0.0409958
    accel_bias_y: 0.991383
    accel_bias_z: 0.032677

    gyro_bias_x: 0.0
    gyro_bias_y: 0.0
    gyro_bias_z: 0.0

    accel_covariance:
      [
        1.64868e-06, 1.95563e-07, 8.17889e-08,
        1.95563e-07, 5.70874e-06, 5.11217e-08,
        8.17889e-08, 5.11217e-08, 1.22049e-06,
      ]

    gyro_covariance:
      [
        1.0e-5, 0.0, 0.0,
        0.0, 1.0e-05, 0.0,
        0.0, 0.0, 1.0e-5
      ]

    # This is a Intrinsic ZYX rotation from base link to imu!
    sensor_roll: 0.0
    sensor_pitch: 0.0
    sensor_yaw: 0.0

competition_state_machine_node:
  ros__parameters:
    tank_robot_plugin:
      distance_approach:
        kp: 2.0
        ki: 0.0
        kd: 0.2
        integral_limit: 0.0
        integral_activation_bound: 0.0

      steering_approach:
        kp: 2.0
        ki: 0.0
        kd: 0.2
        integral_limit: 0.0
        integral_activation_bound: 0.0

      distance_settling:
        kp: 0.0
        ki: 0.0
        kd: 0.0
        integral_limit: 0.0
        integral_activation_bound: 0.0

      steering_settling:
        kp: 1.0
        ki: 3.0
        kd: 0.1
        integral_limit: 0.35
        integral_activation_bound: 0.5

      # init pose lives in alpha/alpha_init_pose_config.yaml
