# RP2040 sensor host devices for CLYDE. See ghost_sensor_host/PROTOCOL.md §8.
# Each device publishes on /sensors/<type>/<name>; the I2C address is derived
# from the device type's default XOR the rotary-switch DAC offset.
#
# COLOR devices may set per-sensor ball-classifier thresholds (red_rb, blue_rb,
# red_min_level, blue_min_level); hardware.launch.py passes them to that device's
# classifier, overriding the shared defaults in base_ros_config.yaml (/**
# section). Omit them to use the shared defaults.
devices:
    debug_color_sensor:
        port: 2            # host input 6 (port = input - 1); input 4 did not respond
        type: COLOR
        # classifier: toggle   # toggle_color_classifier (RED/BLUE/YELLOW/NONE) -> /sensors/color/toggle_sensor/class
        remap_switch: 0      # -> ISL29125 @ 0x3b
        interval_ms: 10
        read_count: 100
    #     config1: 0x1D        # 10,000-lux range, 16-bit RGB
    #     config2: 0xBF        # max IR compensation
    #     # TODO tune: placeholder values. Yellow is checked first, then red, then blue.
    #     yellow_rb: 0.31      # R/B >= this AND G/B >= yellow_gb -> YELLOW
    #     yellow_gb: 2.0
    #     red_rb: 0.31         # R/B >= this (and not yellow) -> RED
    #     blue_rb: 0.245       # R/B <= this -> BLUE
    #     yellow_min_level: 420 # yellow-ratio reading with max(r,g,b) below this -> NONE
    #     red_min_level: 420    # red-ratio reading with max(r,g,b) below this -> NONE
    #     blue_min_level: 440   # blue-ratio reading with max(r,g,b) below this -> NONE
    #     # tune by using the debug tool python scripts/debug/color_sensor.py  /sensors/color/toggle_sensor
    auto_claw:           # name -> topic /sensors/distance/auto_claw
        port: 2              # host input 3 (port = input - 1)
        type: DISTANCE
        remap_switch: 0      # -> VL53L4CD @ 0x56
        interval_ms: 10      # poll period (default 100 ms = 10 Hz); no faster than timing_budget_ms
        read_count: 100
        timing_budget_ms: 10 # VL53L4CD min is 10; longer = more accurate, slower updates

