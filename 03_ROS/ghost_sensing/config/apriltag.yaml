# Passed only to the detector by apriltag.launch.py.
# Family and measured tag size are supplied through launch arguments.
/**:
  ros__parameters:
    image_transport: raw
    qos_profile: sensor_data
    max_hamming: 0
    pose_estimation_method: pnp
    detector:
      threads: 2
      decimate: 1.0
      blur: 0.0
      refine: true
      sharpening: 0.25
      debug: false
