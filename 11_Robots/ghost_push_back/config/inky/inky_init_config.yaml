# Per-match init settings for inky: alliance colour, auton init pose, and which
# behavior tree to run. Kept separate from the main ros_config so it's easy to
# tweak per match.
competition_state_machine_node:
  ros__parameters:
    tank_robot_plugin:
      is_red_alliance: false

      #normal auton init
      init_x_tiles: 3.0
      init_y_tiles: 0.5
      init_theta_degrees: 0.0
      # prog init
      # init_theta_degrees: 160.0
      # init_x_tiles: 0.5
      # init_y_tiles: 0.5

    # Behavior tree XML to load for autons, relative to the ghost_tank
    # package's share config dir. Resolved to an absolute bt_path in
    # inky.launch.py. Easy to swap per match without editing python.
    bt_filename: "bt_isolation_inky.xml"
    bt_filename_interaction: "bt_isolation_inky.xml"
