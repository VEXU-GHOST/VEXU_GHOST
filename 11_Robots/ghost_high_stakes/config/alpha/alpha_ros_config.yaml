ghost_serial_node:
  ros__parameters:
    port_name: "/dev/ttyACM1"
    backup_port_name: "/dev/ttyACM2"
    verbose: false

imu_filter_node:
  ros__parameters:
    input_imu_topic: /camera/camera/gyro/sample
    output_imu_topic: /estimation/imu/filtered
    calculate_bias: false
    calculate_covariance: false
    calibration_time: 60.0
    sensor_frequency: 100.0
    heading_covariance: 0.001

    accel_bias_x: 0.0409958
    accel_bias_y: 0.991383
    accel_bias_z: 0.032677

    gyro_bias_x: -0.00469872
    gyro_bias_y:  0.00181398
    gyro_bias_z: -0.00054047

    accel_covariance:
      [
        1.64868e-06, 1.95563e-07, 8.17889e-08,
        1.95563e-07, 5.70874e-06, 5.11217e-08,
        8.17889e-08, 5.11217e-08, 1.22049e-06,
      ]

    gyro_covariance:
      [
        1.0e-5, 0.0, 0.0,
        0.0, 1.0e-05, 0.0,
        0.0, 0.0, 1.0e-5
      ]

    # This is an Intrinsic ZYX rotation from base link to imu!
    sensor_roll: 0.0
    sensor_pitch: 0.0
    sensor_yaw: 0.0

competition_state_machine_node:
  ros__parameters:
    tank_robot_plugin:
      # Nav Gains
      move_to_pose_kp_xy: 2.0
      move_to_pose_kd_xy: 0.2
      move_to_pose_kp_theta: 2.0
      move_to_pose_kd_theta: 0.2
      move_to_pose_ki_theta: 0.0

      # Settling Gains
      move_to_pose_kp_xy_fine: 0.0
      move_to_pose_kd_xy_fine: 0.0
      move_to_pose_kp_theta_fine: 1.0 #0.75
      move_to_pose_kd_theta_fine: 0.1 #0.1
      move_to_pose_ki_theta_fine: 3.0
      
      move_to_pose_integral_limit: 0.35 #0.5

      init_x_tiles: 1.45
      init_y_tiles: 1.361
      init_theta_degrees: 113.0

