# RP2040 sensor host devices for ALPHA. See ghost_sensor_host/PROTOCOL.md §8.
# Each device publishes on /sensors/<type>/<name>; the I2C address is derived
# from the device type's default XOR the rotary-switch DAC offset.
#
# COLOR devices may set per-sensor ball-classifier thresholds (red_rb, blue_rb,
# min_level); hardware.launch.py passes them to that device's classifier,
# overriding the shared defaults in base_ros_config.yaml (/** section). Omit
# them to use the shared defaults.
devices:
    mid_conveyor:
        port: 5              # host input 6 (port = input - 1)
        type: COLOR
        remap_switch: 0      # -> ISL29125 @ 0x3b
        config1: 0x0D        # 10,000-lux range, 16-bit RGB
        config2: 0xBF        # max IR compensation
        red_rb: 0.31         # R/B >= this -> RED
        blue_rb: 0.27        # R/B <= this -> BLUE
        min_level: 6300      # max(r,g,b) below this -> NONE
        # tune by using the debug tool python scripts/debug/color_sensor.py  /sensors/color/mid_conveyor
    sorter_hood:
        port: 6              # host input 7 (port = input - 1)
        type: COLOR
        remap_switch: 0      # -> ISL29125 @ 0x3b
        config1: 0x0D        # 10,000-lux range, 16-bit RGB
        config2: 0xBF        # max IR compensation
        red_rb: 0.50          # R/B >= this -> RED
        blue_rb: 0.32         # R/B <= this -> BLUE
        min_level: 4000      # max(r,g,b) below this -> NONE
