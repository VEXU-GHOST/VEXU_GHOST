# Goal prism bounds in map frame (meters).
# Derived from pushBackField.urdf collision boxes — keep in sync when URDF changes.
#
# Long goal outers: yaw 90° → 0.481 m along Y, 0.15 m along X/Z (13.33" middle omitted).
# Center goals: yaw ±45° → axis-aligned bbox of 0.56 × 0.125 × 0.125 m box.
#
# goal_logic (used once goal_reader implements control):
#   min_y / max_y — outermost block on that axis within this prism
#   both          — two publish_ids: min(y) and max(y) over same block set
#   none          — counts only, control always 0

goals:
  - id: long_goal_1_side_1
    x_min: 2.95
    x_max: 3.10
    y_min: 1.178
    y_max: 1.660
    z_min: 0.325
    z_max: 0.475
    goal_logic: min_y

  - id: long_goal_1_side_2
    x_min: 2.95
    x_max: 3.10
    y_min: 1.998
    y_max: 2.478
    z_min: 0.325
    z_max: 0.475
    goal_logic: max_y

  - id: long_goal_2_side_1
    x_min: 0.565
    x_max: 0.715
    y_min: 1.178
    y_max: 1.660
    z_min: 0.325
    z_max: 0.475
    goal_logic: min_y

  - id: long_goal_2_side_2
    x_min: 0.565
    x_max: 0.715
    y_min: 1.998
    y_max: 2.478
    z_min: 0.325
    z_max: 0.475
    goal_logic: max_y

  - id: center_goal_high
    x_min: 1.586
    x_max: 2.070
    y_min: 1.586
    y_max: 2.070
    z_min: 0.1875
    z_max: 0.3125
    goal_logic: both
    publish_ids:
      - center_goal_high_side_1
      - center_goal_high_side_2

  - id: center_goal_low
    x_min: 1.586
    x_max: 2.070
    y_min: 1.586
    y_max: 2.070
    z_min: 0.0125
    z_max: 0.1375
    goal_logic: both
    publish_ids:
      - center_goal_low_side_1
      - center_goal_low_side_2
