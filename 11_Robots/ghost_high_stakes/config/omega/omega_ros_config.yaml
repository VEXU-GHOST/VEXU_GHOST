ghost_serial_node:
  ros__parameters:
    port_name: "/dev/ttyACM1"
    backup_port_name: "/dev/ttyACM2"
    verbose: false

imu_filter_node:
  ros__parameters:
    input_imu_topic: /sensors/imu
    output_imu_topic: /estimation/imu/filtered
    calculate_bias: false
    calculate_covariance: false
    calibration_time: 5.0
    sensor_frequency: 100.0
    heading_covariance: 0.001

    accel_bias_x: 0.0409958
    accel_bias_y: 0.991383
    accel_bias_z: 0.032677

    gyro_bias_x: 0.0
    gyro_bias_y: 0.0
    gyro_bias_z: 0.0

    accel_covariance:
      [
        1.64868e-06, 1.95563e-07, 8.17889e-08,
        1.95563e-07, 5.70874e-06, 5.11217e-08,
        8.17889e-08, 5.11217e-08, 1.22049e-06,
      ]

    gyro_covariance:
      [
        1.0e-5, 0.0, 0.0,
        0.0, 1.0e-05, 0.0,
        0.0, 0.0, 1.0e-5
      ]

    # This is a Intrinsic ZYX rotation from base link to imu!
    sensor_roll: 0.0
    sensor_pitch: 0.0
    sensor_yaw: 0.0

competition_state_machine_node:
  ros__parameters:
    tank_robot_plugin:
      neutral_stake_arm_kp: 0.03
      neutral_stake_arm_gear_ratio: 9.0 #3.0
      neutral_stake_arm_rest_pos_deg: 0.0
      neutral_stake_arm_loading_pos_deg: 30.0
      neutral_stake_arm_score_neutral_pos_deg: 110.0
      neutral_stake_arm_score_alliance_pos_deg: 165.0
      neutral_stake_arm_down_pos_deg: 240.0

      # Nav Gains
      move_to_pose_kp_xy: 2.0
      move_to_pose_kd_xy: 0.2
      move_to_pose_kp_theta: 2.0
      move_to_pose_kd_theta: 0.2
      move_to_pose_ki_theta: 0.0

      # Settling Gains
      move_to_pose_kp_xy_fine: 0.0
      move_to_pose_kd_xy_fine: 0.0
      move_to_pose_kp_theta_fine: 0.4
      move_to_pose_kd_theta_fine: 0.1
      move_to_pose_ki_theta_fine: 3.0

      # Arcturn Gains
      move_to_pose_kp_xy_arc: 0.0
      move_to_pose_kd_xy_arc: 0.0
      move_to_pose_kp_theta_arc: 0.8 #0.75
      move_to_pose_kd_theta_arc: 0.1 #0.1
      move_to_pose_ki_theta_arc: 6.0
      
      move_to_pose_integral_limit: 0.7

      init_x_tiles: 2.4
      init_y_tiles: 0.4
      init_theta_degrees: -20.0