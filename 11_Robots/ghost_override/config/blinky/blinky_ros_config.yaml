# Serial ports (ghost_serial_node / ghost_sensor_host_serial_node) are NOT set
# per-robot: hardware.launch.py auto-detects them by USB id via /dev/serial/by-id
# and base_ros_config.yaml holds the fallbacks. See those files.

imu_filter_node:
  ros__parameters:
    input_imu_topic: /sensors/imu
    output_imu_topic: /estimation/imu/filtered
    calculate_bias: false
    calculate_covariance: false
    calibration_time: 5.0
    sensor_frequency: 100.0
    heading_covariance: 0.001

    accel_bias_x: 0.0409958
    accel_bias_y: 0.991383
    accel_bias_z: 0.032677

    gyro_bias_x: 0.0
    gyro_bias_y: 0.0
    gyro_bias_z: 0.0

    accel_covariance:
      [
        1.64868e-06, 1.95563e-07, 8.17889e-08,
        1.95563e-07, 5.70874e-06, 5.11217e-08,
        8.17889e-08, 5.11217e-08, 1.22049e-06,
      ]

    gyro_covariance:
      [
        1.0e-5, 0.0, 0.0,
        0.0, 1.0e-05, 0.0,
        0.0, 0.0, 1.0e-5
      ]

    # This is a Intrinsic ZYX rotation from base link to imu!
    sensor_roll: 0.0
    sensor_pitch: 0.0
    sensor_yaw: 0.0

competition_state_machine_node:
  ros__parameters:
    tank_robot_plugin:
    #   neutral_stake_arm_kp: 0.05
    #   neutral_stake_arm_gear_ratio: 9.0 #3.0
    #   neutral_stake_arm_rest_pos_deg: 0.0
    #   neutral_stake_arm_loading_pos_deg: 30.0
    #   neutral_stake_arm_score_neutral_pos_deg: 110.0
    #   neutral_stake_arm_score_alliance_pos_deg: 165.0
    #   neutral_stake_arm_down_pos_deg: 240.0
    #   neutral_stake_arm_settled_threshold_deg: 15.0

      distance_approach:
        kp: 0.0
        ki: 1.0
        kd: 0.4
        integral_limit: 0.3
        integral_activation_bound: 0.75

      steering_approach:
        kp: 0.0
        ki: 0.0
        kd: 0.15
        integral_limit: 0.0
        integral_activation_bound: 0.0

      distance_settling:
        kp: 0.2
        ki: 0.0
        kd: 0.1
        integral_limit: 0.5
        integral_activation_bound: 1.0

      steering_settling:
        kp: 0.4
        ki: 0.0
        kd: 0.3
        integral_limit: 0.5
        integral_activation_bound: 10.0

      arc_turn:
        kp: 0.75
        ki: 0.0
        kd: 0.01
        integral_limit: 0.75
        integral_activation_bound: 0.2

      arm:
        kp: 0.003
        ki: 0.0
        kd: 0.000
        integral_limit: 0.5
        integral_activation_bound: 250.0
      arm_stage_positions_deg: [0.0, 1650.0]

      lift:
        kp: 0.003
        ki: 0.000
        kd: 0.000
        integral_limit: 0.0
        integral_activation_bound: 0.0
      lift_stage_positions_deg: [400.0, 800.0, 1800.0, 2500.0, 1600.0, 2300.0, 2900.0, 3500.0]

      # Toggle seek (X in teleop): run toggle_mech_motor until the toggle sensor
      # reads our alliance colour (is_red_alliance -> RED, else BLUE).
      toggle_color_topic: "/sensors/color/toggle_sensor/class"
      toggle_seek_power: 0.5     # signed; flip the sign to seek the other way
      toggle_seek_timeout: 2.0   # s before giving up

      sorter_io_port: 5  # no sorter on blinky; port 0 (A) is the clamp

      # Auto-claw (teleop): while L1 is held with the clamp open, close the clamp
      # when the auto_claw distance sensor reads below auto_claw_close_mm. If it
      # hasn't closed by the time L1 is released (or no sensor is plugged in),
      # it closes on release.
      auto_claw_topic: "/sensors/distance/auto_claw"
      auto_claw_close_mm: 85.0

      # init pose / alliance / auton BT live in blinky/blinky_init_config.yaml