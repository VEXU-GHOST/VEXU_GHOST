# Shared VEXU Ghost C++ formatting rules for uncrustify.
# Run locally: uncrustify -c .uncrustify.cfg --replace <files>
# CI checks via ./scripts/lint.sh

indent_with_tabs    = 0
input_tab_size      = 4
output_tab_size     = 4
indent_columns      = 4
indent_class        = true
indent_access_spec  = 2
indent_namespace    = false
indent_case_brace   = 0
indent_brace_parent = false
indent_label        = 1
indent_switch_case  = 4

nl_end_of_file      = add
nl_max              = 2

mod_paren_on_return = remove
sp_before_sparen    = force
sp_after_sparen     = remove
sp_inside_paren     = remove
sp_after_comma      = force
sp_before_comma     = remove

align_func_params   = true
align_var_def_span  = 3

cmt_indent_multi    = true

pp_indent           = add
pp_space            = remove

pad_oper            = true
pad_paren             = out
pad_first_paren_out   = remove

keep_one_line_blocks = false
keep_one_line_funcs  = false

code_width          = 120
