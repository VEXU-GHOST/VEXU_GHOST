# Serial ports below are FALLBACKS only. hardware.launch.py auto-detects the
# real device path at startup by USB vendor:product -- the V5 brain (2888:0501,
# interface 2 = the "User Port") and the RP2040 sensor host (2e8a:000a) -- and
# overrides these. That needs no udev rules, so it works on any machine. The
# /dev/ttyACMx values here are only used if detection fails (e.g. pyserial
# missing); never trust them otherwise -- those numbers reshuffle on replug and
# the V5 brain claims two of them.
ghost_serial_node:
  ros__parameters:
    port_name: "/dev/ttyACM1"
    backup_port_name: "/dev/ttyACM1"
    verbose: false

ghost_sensor_host_serial_node:
  ros__parameters:
    serial_port: "/dev/ttyACM0"
    topic_namespace: "/sensors"
    # Device map (what sensors, where) is the per-robot *_sensor_host_config.yaml
    # (device_config, set by hardware.launch.py). See ghost_sensor_host/PROTOCOL.md §8.

bag_recorder_service:
  ros__parameters:
    disk_space_required_kb: 256000
    disk_check_period_s: 10

tts_music_node:
  ros__parameters:
    volume: 150  # set to 0 to turn off, set to 100 at comp

competition_state_machine_node:
  ros__parameters:
    odom_topic: "/sensors/wheel_odom"
    backup_pose_topic: "/odom_ekf/odometry"
    pose_topic: "/map_ekf/odometry"
    set_pf_pose_topic: "/set_pf_pose"

    tank_robot_plugin:
      # conveyor_num_links: 69.0
      # conveyor_sprocket_teeth: 12.0
      # conveyor_num_hooks: 3.0

      # conveyor_hook_align_threshold: 0.85
      # conveyor_hook_align_power: 0.5

      # conveyor_hook_throw_fraction: 0.5
      # conveyor_hook_throw_duration: 0.25

      ring_score_timeout: 0.3
      ring_prewait_time: 0.05

      drive_motor_ticks_per_rotation: 360.0
      drive_gear_ratio: 1.15 # 23/20
      drive_wheel_rad_in: 1.375
      wheel_base_inches: 12.6875
      
      cmd_twist_topic: "/cmd_vel" # from ekf
      bag_recorder_start_topic: "bag_recorder/start"
      bag_recorder_stop_topic: "bag_recorder/stop"

      cmd_pose_topic: "/set_pose"
      imu_topic: "/sensors/imu"
      des_twist_topic: "/des_vel"
      cur_twist_topic: "/cur_vel"
      des_pos_topic: "/des_pos"
      err_pos_topic: "/err_pos"
      use_backup_estimator: false
      sim_mode: false

/**:
  ros__parameters:
    behavior_tree:
      trajectory_topic: "/motion_planner/trajectory"
    
    use_sim_time: false
    should_record: false
    system_i2c_bus_path: "/dev/i2c-7"
    # Ball colour classifier thresholds (ghost_sensing/ball_color_classifier).
    # Classified from the raw R/B ratio (green ignored). Shared by every
    # classifier instance via this /** section.
    red_rb: 1.4        # R/B >= this -> RED
    blue_rb: 0.7       # R/B <= this -> BLUE
    min_level: 1500    # max(r,g,b) below this -> NONE


tts_music_node:
  ros__parameters:
    volume: 150  # set to 0 to turn off, set to 100 at comp
gpio_expander:
  ros__parameters:
    gpio: #topic type is int64
      "/io/leds/other": 
        pins: [10,8,9]
        output: True
      # "/io/leds/color_red":
      #   pins: [8]
      #   output: True
      # "/io/leds/side_right":
      #   pins: [9]
      #   output: True
      "/io/buttons/color_target": 
        pins: [2]
        output: False
      "/io/buttons/mirrored": 
        pins: [4]
        output: False
      "/io/buttons/reset": 
        pins: [7]
        output: False
      "/io/buttons/other": 
        pins: [6]
        output: False
      "/io/leds/bag": 
        pins: [11]
        output: True
      "/io/buttons/bag":
        pins: [0]
        output: False
