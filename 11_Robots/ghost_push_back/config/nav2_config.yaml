# nav2 stack configuration for the push-back robot: map_server, planner_server
# (+ its global_costmap) and controller_server (+ its local_costmap). Split out
# of base_ros_config.yaml. Loaded by the nav2 nodes in hardware.launch.py, and
# by map_server via ghost_localization/launch/map_server.launch.py.

map_server:
  ros__parameters:
    # Occupancy grid served on /map by the nav2 map server (see
    # ghost_localization/launch/map_server.launch.py).
    yaml_filename: "/home/ghost/VEXU_GHOST/03_ROS/ghost_localization/maps/pushBackMapConfig.yaml"

# nav2 planner server. SmacPlanner2D settings copied from innate-os
# (maurice_nav/config/planner.yaml). Plans over the global_costmap below.
# Launched (with its lifecycle manager) from hardware.launch.py.
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    costmap_update_timeout: 1.0
    service_introspection_mode: "disabled"
    planner_plugins: ['GridBased']
    use_sim_time: false

    GridBased:
      # pure grid search + spin-on-spot
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.1
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.4
        w_data: 0.2
        tolerance: 1e-10
      allow_parameter_qos_overrides: true

# Global costmap owned by planner_server. Adapted from innate-os
# (maurice_nav/config/costmap.yaml): the RGBD/voxel camera layers were dropped
# since ghost has no /mars/main_camera point cloud here -- only the static map
# layer and the RPLidar /scan obstacle layer feed it.
# TODO(ghost): footprint and inflation_radius are copied from innate-os and
# should be retuned to the push back robot's actual dimensions.
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      footprint: "[[0.2286, 0.1905], [0.2286, -0.1905], [-0.1524, -0.1905], [-0.1524, 0.1905]]"
      resolution: 0.0254
      track_unknown_space: true        # Unknown areas are treated as obstacles
      unknown_cost_value: 255          # Unknown cells set to a lethal cost
      rolling_window: false
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: "/map"
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: False # TODO: URGENT
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.2
          obstacle_max_range: 2.5
          obstacle_min_range: 0.2
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.3
      always_send_full_costmap: False

# nav2 controller server. Drives a planned path with the Regulated Pure Pursuit
# controller and publishes cmd_vel; ghost_tank's FollowPathControllerServer BT
# node sends it the FollowPath action goal and relays the cmd_vel to the drive.
# cmd_vel is remapped to /nav2/cmd_vel in hardware.launch.py to avoid clobbering
# the existing /cmd_vel. Launched (with its lifecycle manager) alongside the
# planner_server.
#
# NOTE: requires the nav2_controller and nav2_regulated_pure_pursuit_controller
# packages (ros-humble-nav2-controller,
# ros-humble-nav2-regulated-pure-pursuit-controller) to be installed.
# The FollowPath params below are the Humble RPP parameter names; several names
# from newer/forked RPP configs (max_linear_vel, min_linear_vel, max_*_accel,
# use_dynamic_window, allow_obstacle_checking_beyond_goal, min_distance_to_obstacle)
# do not exist in Humble and were mapped/dropped accordingly.
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    # Velocity feedback for the controllers. nav2 gets the robot POSE from TF
    # (map->base_link) but reads its measured velocity from this topic. Without it
    # (default "odom", which nothing publishes here) curr_speed is always 0, so
    # RPP's and the rotation shim's acceleration-limited rotate-to-heading stay
    # pinned at max_angular_accel/controller_frequency (~0.1 rad/s) and never ramp.
    # Use the continuous odom-frame EKF (body-frame twist). NOTE: its twist.angular.z
    # must match the cmd_vel/turn sign convention or the accel clamp fights the ramp.
    odom_topic: /odom_ekf/odometry
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"  # singular: Humble and older
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.20
      stateful: True
    # RotationShimController wraps RPP: when the robot's heading is more than
    # angular_dist_threshold off the initial path direction, it rotates in place
    # toward the path first, then hands off to the primary_controller (RPP) for the
    # actual path following. Helps when the planner hands us a path that starts off
    # to the side/behind. All the RPP params below live in this same namespace and
    # are read by the primary controller it instantiates.
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # Rotate in place toward the path when heading error exceeds this (rad).
      angular_dist_threshold: 0.785
      # How far along the path to sample the heading we rotate toward (m).
      forward_sampling_distance: 0.2
      # Collision-check horizon for the in-place rotation (s).
      simulate_ahead_time: 1.0
      # Let the SHIM perform the final end-of-path rotation to the goal yaw once
      # inside xy_goal_tolerance, instead of RPP's internal rotateToHeading. The
      # shim closes heading on TF (correctly signed -> right direction, sharp stop)
      # and only ramps the angular *speed*, so it's robust to the odom angular sign.
      rotate_to_goal_heading: true
      # Ramp the rotate-to-heading speed open-loop off the shim's own last command
      # instead of measured odom velocity. Immune to the gyro/EKF angular.z sign,
      # and avoids the accel clamp pinning at max_angular_accel/controller_freq when
      # odom velocity reads ~0. (See odom_topic note on controller_server above.)
      closed_loop: false
      # --- primary controller (RPP) params, same namespace ---
      desired_linear_vel: 0.5          # was max_linear_vel
      # Smaller lookahead = tighter corner tracking (carrot closer to robot, less
      # corner-cutting). Too small -> weaving/oscillation on straights. Was 0.6.
      lookahead_dist: 0.25
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.4
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.9
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.3
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: false
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      regulated_linear_scaling_min_radius: 0.75
      regulated_linear_scaling_min_speed: 0.25
      # true: REQUIRED for final heading. SmacPlanner2D stamps the last path pose
      # with the commanded goal yaw (use_final_approach_orientation: false above),
      # and RPP only rotates in place to that yaw -- via shouldRotateToGoalHeading,
      # gated by distance < xy_goal_tolerance -- when this is true. The goal_checker
      # merely *checks* yaw; it never produces rotation, so with this false the yaw
      # tolerance can never be met and final heading is effectively ignored.
      use_rotate_to_heading: true
      allow_reversing: false
      # Gates ONLY the mid-path spin-to-face-the-path (shouldRotateToPath), NOT the
      # final-heading rotation. Keep near the 0.785 default; lower values make the
      # robot stop and spin in place at every path start/corner.
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.0

# Local costmap owned by controller_server. Configured to mirror the global
# costmap (full field, non-rolling, same /map static layer + /scan obstacle
# layer) so the controller's collision checking sees the same world the planner
# planned over -- effectively "using the global costmap" without a separate
# sensor setup.
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      footprint: "[[0.2286, 0.1905], [0.2286, -0.1905], [-0.1524, -0.1905], [-0.1524, 0.1905]]"
      resolution: 0.05
      track_unknown_space: true
      unknown_cost_value: 255
      rolling_window: false            # full field, matches global_costmap
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: "/map"
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.2
          obstacle_max_range: 2.5
          obstacle_min_range: 0.2
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.4
      always_send_full_costmap: False
