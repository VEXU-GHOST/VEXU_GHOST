# Goal prism bounds in map frame (meters) — dev enclosure (center goal only).
# Derived from devField.urdf collision boxes — keep in sync when URDF changes.
# Center goals: yaw ±45° → axis-aligned bbox of 0.56 × 0.125 × 0.125 m box.

goals:
  - id: center_goal_high
    x_min: 1.586
    x_max: 2.070
    y_min: 1.586
    y_max: 2.070
    z_min: 0.1875
    z_max: 0.3125
    goal_logic: both
    publish_ids:
      - center_goal_high_side_1
      - center_goal_high_side_2

  - id: center_goal_low
    x_min: 1.586
    x_max: 2.070
    y_min: 1.586
    y_max: 2.070
    z_min: 0.0125
    z_max: 0.1375
    goal_logic: both
    publish_ids:
      - center_goal_low_side_1
      - center_goal_low_side_2
